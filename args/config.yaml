# Configuration - Générateur de PowerPoint Paroissial
# Phase Link - Paramètres API, design, typographie

# --- Format de présentation ---
presentation:
  aspect_ratio: "16:9"  # Widescreen (13.333" x 7.5")
  # alternative: "4:3" (10" x 7.5")

# --- API AELF ---
aelf:
  base_url: "https://api.aelf.org"
  endpoints:
    messes: "/v1/messes/{date}/{zone}"
    informations: "/v1/informations/{date}/{zone}"
  zone_default: "france"
  timeout_seconds: 10

# --- Design des slides ---
# Texte noir : les fonds doivent rester clairs.
design:
  background:
    color: "#FFFFFF"        # lectures et messages
    color_chant: "#EEF5EE"  # chants (vert très clair, pour les différencier)
  text:
    font: "Calibri"
    size: 54
    color: "#000000"
  title:
    font: "Calibri"
    size: 24
    color: "#000000"
    bold: true

# --- Découpage du texte (tools/slicing.py) ---
slicing:
  max_chars_per_slide: 150
  max_lines_per_slide: 6    # lignes affichées (évite le débordement à 54 pt)
  chars_per_line: 30        # estimation prudente Calibri 54, 16:9

# --- Base de données chants ---
db:
  path: "data/chants.db"
  # Alternative JSON :
  # json_path: "data/chants.json"
